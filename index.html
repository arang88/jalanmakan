<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc" id="metaThemeColor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Port Makan & Jalan</title>
    <style>
        /* =====================================================================
           1. DESIGN TOKENS — LIGHT MODE DEFAULT + DARK MODE THEME
           100% self-contained CSS (zero external CDN required)
           ===================================================================== */
        :root {
            --bg-page: #f4f6f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --bg-input: #f8fafc;
            --bg-nav: rgba(255, 255, 255, 0.94);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --border: #e2e8f0;
            --border-strong: #cbd5e1;

            --teal: #0d9488;
            --teal-hover: #0f766e;
            --teal-soft: #f0fdfa;
            --teal-border: #99f6e4;
            --teal-text: #0f766e;

            --orange: #ea580c;
            --orange-soft: #fff7ed;
            --orange-border: #fed7aa;
            --orange-text: #c2410c;

            --indigo: #4f46e5;
            --indigo-soft: #eef2ff;
            --indigo-border: #c7d2fe;
            --indigo-text: #4338ca;

            --emerald: #059669;
            --emerald-soft: #ecfdf5;
            --emerald-border: #a7f3d0;
            --emerald-text: #047857;

            --amber: #d97706;
            --amber-soft: #fffbeb;
            --amber-border: #fde68a;
            --amber-text: #b45309;

            --rose: #e11d48;
            --rose-soft: #fff1f2;
            --rose-border: #fecdd3;
            --rose-text: #be123c;

            --wa-green: #16a34a;
            --wa-soft: #f0fdf4;
            --wa-border: #bbf7d0;
            --wa-text: #15803d;

            --maps-blue: #2563eb;
            --maps-soft: #eff6ff;
            --maps-border: #bfdbfe;
            --maps-text: #1d4ed8;

            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.1);
            --shadow-lg: 0 18px 40px -8px rgba(15, 23, 42, 0.2);

            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 22px;

            --nav-h: 66px;
            --header-h: 58px;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html[data-theme="dark"] {
            --bg-page: #0b1120;
            --bg-surface: #111827;
            --bg-card: #162032;
            --bg-subtle: #1e293b;
            --bg-input: #0f172a;
            --bg-nav: rgba(17, 24, 39, 0.94);

            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;

            --border: #253349;
            --border-strong: #334155;

            --teal: #14b8a6;
            --teal-hover: #2dd4bf;
            --teal-soft: rgba(20, 184, 166, 0.14);
            --teal-border: rgba(45, 212, 191, 0.32);
            --teal-text: #5eead4;

            --orange: #fb923c;
            --orange-soft: rgba(251, 146, 60, 0.14);
            --orange-border: rgba(251, 146, 60, 0.32);
            --orange-text: #fdba74;

            --indigo: #818cf8;
            --indigo-soft: rgba(129, 140, 248, 0.15);
            --indigo-border: rgba(129, 140, 248, 0.32);
            --indigo-text: #a5b4fc;

            --emerald: #10b981;
            --emerald-soft: rgba(16, 185, 129, 0.14);
            --emerald-border: rgba(52, 211, 153, 0.32);
            --emerald-text: #6ee7b7;

            --amber: #f59e0b;
            --amber-soft: rgba(245, 158, 11, 0.14);
            --amber-border: rgba(251, 191, 36, 0.32);
            --amber-text: #fcd34d;

            --rose: #f43f5e;
            --rose-soft: rgba(244, 63, 94, 0.15);
            --rose-border: rgba(251, 113, 133, 0.34);
            --rose-text: #fda4af;

            --wa-green: #22c55e;
            --wa-soft: rgba(34, 197, 94, 0.14);
            --wa-border: rgba(74, 222, 128, 0.32);
            --wa-text: #86efac;

            --maps-blue: #60a5fa;
            --maps-soft: rgba(59, 130, 246, 0.15);
            --maps-border: rgba(96, 165, 250, 0.34);
            --maps-text: #93c5fd;

            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
            --shadow-md: 0 10px 26px -4px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 20px 44px -8px rgba(0, 0, 0, 0.65);
        }

        /* =====================================================================
           2. RESET & BASE LAYOUT
           ===================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        @keyframes viewIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spin-anim {
            animation: spin 0.9s linear infinite;
        }

        /* =====================================================================
           3. TOP APP BAR (STICKY)
           ===================================================================== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 40;
            height: var(--header-h);
            background: var(--bg-nav);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 720px;
            height: 100%;
            margin: 0 auto;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--teal), #0284c7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px -2px rgba(13, 148, 136, 0.42);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-sub {
            font-size: 0.69rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 30px;
            padding: 0 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            color: var(--text-secondary);
            transition: all 0.16s ease;
        }
        .sync-pill:active { transform: scale(0.95); }
        .sync-pill.live {
            background: var(--emerald-soft);
            border-color: var(--emerald-border);
            color: var(--emerald-text);
        }
        .sync-pill.warn {
            background: var(--rose-soft);
            border-color: var(--rose-border);
            color: var(--rose-text);
        }
        .sync-pill.syncing {
            background: var(--amber-soft);
            border-color: var(--amber-border);
            color: var(--amber-text);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .lang-switch {
            display: inline-flex;
            align-items: center;
            padding: 2px;
            height: 30px;
            border-radius: 999px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
        }

        .lang-btn {
            height: 24px;
            padding: 0 7px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }
        .lang-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-xs);
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .icon-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }
        .icon-btn:active { transform: scale(0.93); }

        /* =====================================================================
           4. MAIN CONTAINER & TAB VIEWS
           ===================================================================== */
        .app-main {
            max-width: 720px;
            margin: 0 auto;
            padding: 14px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
        }

        .view-pane {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: viewIn 0.18s ease-out;
        }

        /* =====================================================================
           5. CHIPS, FILTER ROWS & NEARBY PANEL
           ===================================================================== */
        .chip-scroll {
            display: flex;
            align-items: center;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .chip-scroll::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 13px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: var(--shadow-xs);
            transition: all 0.15s ease;
        }
        .chip:active { transform: scale(0.95); }
        .chip-sm {
            height: 30px;
            padding: 0 11px;
            font-size: 0.74rem;
        }

        .chip.active-all {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-card);
        }
        .chip.active-makan {
            background: var(--orange);
            border-color: var(--orange);
            color: #ffffff;
        }
        .chip.active-tempat {
            background: var(--teal);
            border-color: var(--teal);
            color: #ffffff;
        }
        .chip.active-aktiviti {
            background: var(--indigo);
            border-color: var(--indigo);
            color: #ffffff;
        }
        .chip.active-teal {
            background: var(--teal);
            border-color: var(--teal);
            color: #ffffff;
        }

        /* Row 2 on Home: State Dropdown + Nearby Button + Reset */
        .home-filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-state-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .home-state-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--teal);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .home-state-select {
            width: 100%;
            height: 38px;
            padding: 0 32px 0 33px;
            border-radius: var(--r-md);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 700;
            appearance: none;
            -webkit-appearance: none;
            box-shadow: var(--shadow-xs);
            outline: none;
            transition: border-color 0.15s ease;
        }
        .home-state-select:focus { border-color: var(--teal); }

        .home-state-chevron {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .home-nearby-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 12px;
            border-radius: var(--r-md);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.79rem;
            font-weight: 700;
            box-shadow: var(--shadow-xs);
            transition: all 0.16s ease;
        }
        .home-nearby-btn:hover { border-color: var(--teal-border); color: var(--teal-text); }
        .home-nearby-btn:active { transform: scale(0.95); }
        .home-nearby-btn.is-active {
            background: var(--teal);
            border-color: var(--teal);
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(13, 148, 136, 0.38);
        }

        .home-reset-chip {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 38px;
            padding: 0 10px;
            border-radius: var(--r-md);
            background: var(--rose-soft);
            border: 1px solid var(--rose-border);
            color: var(--rose-text);
            font-size: 0.76rem;
            font-weight: 700;
            transition: transform 0.15s ease;
        }
        .home-reset-chip:active { transform: scale(0.95); }

        /* Nearby Active Panel */
        .nearby-banner {
            background: var(--teal-soft);
            border: 1px solid var(--teal-border);
            border-radius: var(--r-lg);
            padding: 11px 12px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            animation: viewIn 0.18s ease-out;
        }

        .nearby-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .nearby-loc-info {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--teal-text);
        }

        .nearby-loc-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nearby-head-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .nearby-mini-btn {
            height: 28px;
            padding: 0 9px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--teal-border);
            color: var(--teal-text);
            font-size: 0.71rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s ease;
        }
        .nearby-mini-btn:active { transform: scale(0.94); }
        .nearby-mini-btn.icon-only { width: 28px; padding: 0; }
        .nearby-mini-btn.close { color: var(--rose-text); border-color: var(--rose-border); }

        .nearby-manual-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px dashed var(--teal-border);
        }

        .nearby-warn-txt {
            font-size: 0.74rem;
            color: var(--amber-text);
            font-weight: 600;
            line-height: 1.4;
        }

        /* =====================================================================
           6. COMPACT, SCANNABLE VERTICAL FEED CARDS (NO THUMBNAILS, NO DATES, NO URL PREVIEW)
           ===================================================================== */
        .cards-feed {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .place-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 14px;
            box-shadow: var(--shadow-xs);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }
        .place-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .card-badges {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .cat-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.71rem;
            font-weight: 800;
            border: 1px solid transparent;
        }
        .cat-makan {
            background: var(--orange-soft);
            border-color: var(--orange-border);
            color: var(--orange-text);
        }
        .cat-tempat {
            background: var(--teal-soft);
            border-color: var(--teal-border);
            color: var(--teal-text);
        }
        .cat-aktiviti {
            background: var(--indigo-soft);
            border-color: var(--indigo-border);
            color: var(--indigo-text);
        }

        .state-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.71rem;
            font-weight: 700;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .dist-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.71rem;
            font-weight: 800;
            background: var(--emerald-soft);
            border: 1px solid var(--emerald-border);
            color: var(--emerald-text);
        }

        .plat-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 0.69rem;
            font-weight: 700;
            background: var(--bg-subtle);
            color: var(--text-muted);
            margin-left: auto;
        }

        .plat-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-fb { background: #1877f2; }
        .dot-tt { background: #111827; }
        html[data-theme="dark"] .dot-tt { background: #f8fafc; }
        .dot-ig { background: #e1306c; }
        .dot-maps { background: #16a34a; }
        .dot-yt { background: #ef4444; }
        .dot-web { background: #64748b; }

        .card-main {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.35;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            word-break: break-word;
        }
        .card-title:hover { color: var(--teal); }

        .card-note {
            margin: 0;
            font-size: 0.82rem;
            line-height: 1.48;
            color: var(--text-secondary);
            background: var(--bg-subtle);
            padding: 8px 10px;
            border-radius: var(--r-sm);
            border-left: 3px solid var(--teal);
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .card-primary-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .open-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 13px;
            border-radius: var(--r-sm);
            background: var(--teal);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            transition: background 0.15s ease, transform 0.14s ease;
        }
        .open-link-btn:hover { background: var(--teal-hover); }
        .open-link-btn:active { transform: scale(0.96); }

        .maps-chip-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 34px;
            padding: 0 11px;
            border-radius: var(--r-sm);
            background: var(--maps-soft);
            border: 1px solid var(--maps-border);
            color: var(--maps-text);
            font-size: 0.76rem;
            font-weight: 700;
            transition: transform 0.14s ease;
        }
        .maps-chip-btn:active { transform: scale(0.95); }

        .card-icon-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        .card-act-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--r-sm);
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .card-act-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }
        .card-act-btn:active { transform: scale(0.93); }
        .card-act-btn.wa {
            background: var(--wa-soft);
            border-color: var(--wa-border);
            color: var(--wa-text);
        }
        .card-act-btn.danger:hover {
            background: var(--rose-soft);
            border-color: var(--rose-border);
            color: var(--rose-text);
        }

        /* =====================================================================
           7. EMPTY STATES, SEARCH TAB, SPIN TAB & SETTINGS TAB
           ===================================================================== */
        .empty-box {
            background: var(--bg-card);
            border: 1px dashed var(--border-strong);
            border-radius: var(--r-xl);
            padding: 34px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .empty-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--teal-soft);
            color: var(--teal-text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .empty-desc {
            margin: 0;
            max-width: 320px;
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .empty-btns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        /* Panel / Box */
        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 15px;
            box-shadow: var(--shadow-xs);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            margin: 0;
            font-size: 0.92rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-sub {
            margin: 0;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        /* Search Bar */
        .search-wrap {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }

        .search-input {
            width: 100%;
            height: 44px;
            padding: 0 38px 0 40px;
            border-radius: var(--r-md);
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            box-shadow: var(--shadow-xs);
            transition: border-color 0.15s ease;
        }
        .search-input:focus { border-color: var(--teal); }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-subtle);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .filter-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .exp-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 0 2px;
        }

        /* Spin / Roulette Stage */
        .spin-stage {
            background: linear-gradient(145deg, var(--teal-soft), var(--bg-card));
            border: 1px solid var(--teal-border);
            border-radius: var(--r-xl);
            padding: 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spin-reel {
            width: 100%;
            min-height: 76px;
            padding: 14px 16px;
            border-radius: var(--r-lg);
            background: var(--bg-card);
            border: 2px dashed var(--teal-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.12s ease;
        }
        .spin-reel.rolling {
            border-style: solid;
            border-color: var(--teal);
        }

        .spin-reel-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .spin-reel-sub {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--teal-text);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 40px;
            padding: 0 16px;
            border-radius: var(--r-md);
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-full { width: 100%; }

        .btn-teal {
            background: var(--teal);
            color: #ffffff;
            box-shadow: 0 4px 14px -3px rgba(13, 148, 136, 0.45);
        }
        .btn-teal:hover { background: var(--teal-hover); }

        .btn-soft {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--rose);
            color: #ffffff;
        }

        .btn-maps {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-waze {
            background: #0ea5e9;
            color: #ffffff;
        }

        .btn-wa {
            background: var(--wa-green);
            color: #ffffff;
        }

        .mini-chip {
            height: 26px;
            padding: 0 9px;
            border-radius: 999px;
            background: var(--teal-soft);
            border: 1px solid var(--teal-border);
            color: var(--teal-text);
            font-size: 0.71rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .mini-chip:active { transform: scale(0.95); }

        /* Form Elements */
        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .field-lbl {
            font-size: 0.77rem;
            font-weight: 800;
            color: var(--text-secondary);
        }

        .input-field, .select-field, .textarea-field {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--r-md);
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.86rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .input-field:focus, .select-field:focus, .textarea-field:focus {
            border-color: var(--teal);
        }

        .textarea-field {
            min-height: 76px;
            resize: vertical;
            line-height: 1.45;
        }

        .helper {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .gps-tools-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* 3 Category Segmented Picker in Add/Edit Form */
        .cat-seg-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .cat-seg-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 6px;
            border-radius: var(--r-md);
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 800;
            transition: all 0.15s ease;
        }
        .cat-seg-btn:active { transform: scale(0.96); }
        .cat-seg-btn.active-makan {
            background: var(--orange-soft);
            border-color: var(--orange);
            color: var(--orange-text);
        }
        .cat-seg-btn.active-tempat {
            background: var(--teal-soft);
            border-color: var(--teal);
            color: var(--teal-text);
        }
        .cat-seg-btn.active-aktiviti {
            background: var(--indigo-soft);
            border-color: var(--indigo);
            color: var(--indigo-text);
        }

        /* Settings Action Rows */
        .settings-action-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .code-block {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 10px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.75rem;
            line-height: 1.45;
            overflow-x: auto;
            color: var(--text-secondary);
            margin: 0;
        }

        /* =====================================================================
           8. BOTTOM NAVIGATION BAR (MOBILE-FIRST + DESKTOP FLOATING PILL)
           ===================================================================== */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 45;
            height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.06);
        }

        .bottom-nav-inner {
            max-width: 720px;
            height: var(--nav-h);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: center;
            padding: 0 6px;
        }

        .nav-tab {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 0.67rem;
            font-weight: 700;
            transition: color 0.15s ease;
        }
        .nav-tab.active {
            color: var(--teal);
        }

        .nav-add-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-add-btn {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--teal), #0284c7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px -4px rgba(13, 148, 136, 0.52);
            transform: translateY(-6px);
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }
        .nav-add-btn:active {
            transform: translateY(-4px) scale(0.94);
        }

        @media (min-width: 760px) {
            .bottom-nav {
                left: 50%;
                right: auto;
                bottom: 16px;
                transform: translateX(-50%);
                width: min(560px, calc(100vw - 32px));
                height: 62px;
                padding-bottom: 0;
                border-radius: 22px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow-lg);
            }
            .bottom-nav-inner {
                height: 62px;
            }
            .app-main {
                padding-bottom: 104px;
            }
        }

        /* =====================================================================
           9. BOTTOM SHEET MODALS & WA IMPORTER LIST
           ===================================================================== */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(15, 23, 42, 0.56);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }

        .sheet-box {
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            background: var(--bg-surface);
            border-radius: 22px 22px 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes sheetUp {
            from { transform: translateY(24px); opacity: 0.7; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (min-width: 640px) {
            .sheet-backdrop {
                align-items: center;
                padding: 16px;
            }
            .sheet-box {
                border-radius: 22px;
                border-bottom: 1px solid var(--border);
            }
        }

        .sheet-head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }

        .sheet-title {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 800;
        }

        .sheet-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .sheet-foot {
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        /* WA Importer Preview Rows */
        .wa-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 36vh;
            overflow-y: auto;
        }

        .wa-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px;
            border-radius: var(--r-md);
            background: var(--bg-input);
            border: 1px solid var(--border);
        }
        .wa-row.is-dup {
            opacity: 0.55;
        }

        .wa-row-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .wa-row-title {
            font-size: 0.82rem;
            font-weight: 800;
            word-break: break-word;
        }

        .wa-row-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* =====================================================================
           10. TOAST NOTIFICATIONS
           ===================================================================== */
        .toast-wrap {
            position: fixed;
            top: calc(var(--header-h) + 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 80;
            width: min(92vw, 420px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 10px 14px;
            border-radius: var(--r-md);
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
            background: #0f172a;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: viewIn 0.16s ease-out;
        }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #0284c7; }

        @media (max-width: 420px) {
            .filter-grid-3 { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
            .brand-sub { display: none; }
        }
    </style>
</head>
<body>
    <!-- =====================================================================

                    <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>

                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- TOAST CONTAINER -->
    <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

    <!-- =====================================================================
         MAIN VIEWS
         ===================================================================== -->
    <main class="app-main">
        <!-- TAB 1: UTAMA / HOME -->
        <section id="viewHome" class="view-pane">
            <!-- Row 1: Category Chips (Semua / Makan / Tempat / Aktiviti) -->
            <div id="homeCatChips" class="chip-scroll"></div>

            <!-- Row 2: Direct State Dropdown + Nearby GPS Button + Reset -->
            <div class="home-filter-row">
                <div class="home-state-wrap">
                    <span class="home-state-icon" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </span>
                    <select id="homeStateSelect" class="home-state-select" aria-label="Tapis ikut negeri"></select>
                    <span class="home-state-chevron" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </span>
                </div>

                <button type="button" id="btnHomeNearby" class="home-nearby-btn" aria-pressed="false">
                    <svg id="iconHomeNearby" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="7"></circle>
                        <circle cx="12" cy="12" r="2.2" fill="currentColor"></circle>
                        <line x1="12" y1="2" x2="12" y2="5"></line>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="5" y2="12"></line>
                        <line x1="19" y1="12" x2="22" y2="12"></line>
                    </svg>
                    <span id="lblHomeNearby">Berdekatan</span>

                <button type="button" id="btnHomeReset" class="home-reset-chip hidden">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span id="lblHomeReset">Reset</span>
                </button>
            </div>

            <!-- Nearby Active Panel (Detected GPS Area + Radius Filter + Manual Area Switcher) -->
            <div id="homeNearbyPanel" class="nearby-banner hidden">
                <div class="nearby-head">
                    <div class="nearby-loc-info">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                        </svg>
                        <span id="nearbyLocText" class="nearby-loc-text"></span>
                    </div>
                    <div class="nearby-head-actions">
                        <button type="button" id="btnNearbyChange" class="nearby-mini-btn"></button>
                        <button type="button" id="btnNearbyRefresh" class="nearby-mini-btn icon-only" aria-label="Refresh GPS">
                            <svg id="iconNearbySpin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </button>
                        <button type="button" id="btnNearbyClose" class="nearby-mini-btn icon-only close" aria-label="Close Nearby">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="nearbyRadiusChips" class="chip-scroll"></div>
                <div id="nearbyManualRow" class="nearby-manual-row hidden">
                    <div id="nearbyWarnTxt" class="nearby-warn-txt hidden"></div>
                    <select id="nearbyManualSelect" class="select-field" style="padding:8px 11px; font-size:0.81rem;"></select>

            <!-- Row 3 (Auto): District / Area Filter Chips when a State is selected -->
            <div id="homeDistrictChips" class="chip-scroll hidden"></div>

        // =====================================================================
        // 5. CORE HELPERS (DOM, ESCAPE, URL, PLATFORM, LOCATION, GPS)
        // =====================================================================
        const $ = (id) => document.getElementById(id);

        function t() {
            return I18N[state.lang] || I18N.ms;
        }

        function esc(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function genId() {
            return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
        }

        function sanitizeUrl(raw) {
            let s = String(raw || "").trim();
            if (!s) return "";
            const match = s.match(/https?:\/\/[^\s"'<>]+/i);
            if (match) s = match[0];
            else if (/^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s)) s = "https://" + s;
            try {
                const u = new URL(s);
                if (u.protocol === "http:" || u.protocol === "https:") return u.href;
                return "";
            } catch (_) {
                return "";
            }
        }

        function detectPlatform(url) {
            const l = String(url || "").toLowerCase();
            if (l.includes("facebook.com") || l.includes("fb.watch") || l.includes("fb.com") || l.includes("m.facebook")) {
                return { id: "facebook", label: "Facebook", dot: "dot-fb" };
            }
            if (l.includes("tiktok.com")) {
                return { id: "tiktok", label: "TikTok", dot: "dot-tt" };
            }
            if (l.includes("instagram.com") || l.includes("instagr.am")) {
                return { id: "instagram", label: "Instagram", dot: "dot-ig" };
            }
            if (l.includes("maps.google") || l.includes("goo.gl/maps") || l.includes("maps.app.goo.gl") || l.includes("waze.com")) {
                return { id: "maps", label: "Maps", dot: "dot-maps" };
            }
            if (l.includes("youtube.com") || l.includes("youtu.be")) {
                return { id: "youtube", label: "YouTube", dot: "dot-yt" };
            }
            return { id: "web", label: "Web", dot: "dot-web" };
        }

        function mapCategory(raw) {
            const l = String(raw || "").trim().toLowerCase();
            if (l === "makan" || l === "food" || l === "kafe" || l === "cafe" || l === "kopi" || l === "restaurant") return "makan";
            if (l === "aktiviti" || l === "activity" || l === "activities") return "aktiviti";
            if (l === "tempat" || l === "place" || l === "places" || l === "melancong" || l === "travel" || l === "staycation" || l === "alam" || l === "lain-lain" || l === "other") return "tempat";
            return "makan";
        }

        function labelCat(catId) {
            const d = t();
            const c = mapCategory(catId);
            if (c === "tempat") return d.catTempat;
            if (c === "aktiviti") return d.catAktiviti;
            return d.catMakan;
        }

        function mapState(raw) {
            const s = String(raw || "").trim();
            if (!s) return "Selangor";
            const low = s.toLowerCase();
            for (let i = 0; i < STATES.length; i++) {
                if (STATES[i].toLowerCase() === low) return STATES[i];
            }
            if (low.includes("penang") || low.includes("pinang")) return "Pulau Pinang";
            if (low.includes("malacca") || low.includes("melaka")) return "Melaka";
            if (low === "kl" || low.includes("kuala lumpur")) return "WP Kuala Lumpur";
            if (low.includes("putrajaya")) return "WP Putrajaya";
            if (low.includes("labuan")) return "WP Labuan";
            if (low.includes("overseas") || low.includes("luar negara")) return "Luar Negara";
            if (low.includes("negeri sembilan") || low === "n9" || low === "ns") return "Negeri Sembilan";
            return "Selangor";
        }

        function labelState(st) {
            const canonical = mapState(st);
            if (state.lang === "en" && STATE_EN_LABELS[canonical]) return STATE_EN_LABELS[canonical];
            return canonical;
        }

        function formatLocation(item) {
            const st = labelState(item.state);
            const dist = String(item.district || "").trim();
            return dist ? (dist + ", " + st) : st;
        }

        function guessCategory(text) {
            const l = String(text || "").toLowerCase();
            if (/(hiking|kayak|atv|snorkeling|diving|camping|workshop|bowling|karaoke|theme park|waterpark|taman tema|escape room|aktiviti|activity|piknik|picnic|jogging|cycling|berbasikal|memancing|fishing|zoo|muzium)/i.test(l)) {
                return "aktiviti";
            }
            if (/(villa|resort|chalet|hotel|homestay|glamping|airbnb|staycation|cabin|suite|pantai|pulau|cuti|trip|jalan|melancong|travel|air terjun|waterfall|cameron|langkawi|kundasang|hatyai|bali|jepun|japan|korea|tempat|view|sunrise|sunset|taman|park)/i.test(l)) {
                return "tempat";
            }
            return "makan";
        }

        function guessStateAndDistrict(text) {
            const l = String(text || "").toLowerCase();
            if (!l) return { state: "", district: "" };
            // 1. Check all known districts first (most specific)
            for (let i = 0; i < STATES.length; i++) {
                const st = STATES[i];
                const dists = STATE_DISTRICTS[st] || [];
                for (let j = 0; j < dists.length; j++) {
                    const dn = dists[j];
                    if (dn.length >= 3 && l.includes(dn.toLowerCase())) {
                        return { state: st, district: dn };
                    }
                }
            }
            // 2. Check state names / aliases
            if (/\b(penang|pulau pinang)\b/i.test(l)) return { state: "Pulau Pinang", district: "" };
            if (/\b(kuala lumpur|\bkl\b)\b/i.test(l)) return { state: "WP Kuala Lumpur", district: "" };
            if (/\b(malacca|melaka)\b/i.test(l)) return { state: "Melaka", district: "" };
            for (let i = 0; i < STATES.length; i++) {
                const st = STATES[i];
                const clean = st.replace(/^WP\s+/i, "").toLowerCase();
                if (l.includes(clean)) return { state: st, district: "" };
            }
            return { state: "", district: "" };
        }

        function guessDistrict(text, stateName) {
            const l = String(text || "").toLowerCase();
            if (!l) return "";
            const st = mapState(stateName);
            const dists = STATE_DISTRICTS[st] || [];
            for (let i = 0; i < dists.length; i++) {
                if (dists[i].length >= 3 && l.includes(dists[i].toLowerCase())) return dists[i];
            }
            return "";
        }

        // --- Geolocation & Distance Helpers ---
        function isValidCoordPair(lat, lng) {
            return typeof lat === "number" && typeof lng === "number" &&
                isFinite(lat) && isFinite(lng) &&
                lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
        }

        function parseCoordsString(raw) {
            const txt = String(raw || "").trim();
            if (!txt) return null;
            const m = txt.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
            if (!m) return null;
            const lat = parseFloat(m[1]);
            const lng = parseFloat(m[2]);
            return isValidCoordPair(lat, lng) ? { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) } : null;
        }

        function extractCoordsFromUrl(url) {
            const s = String(url || "");
            if (!s) return null;
            const patterns = [
                /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,
                /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,
                /[?&](?:q|query|ll)=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/i
            ];
            for (let i = 0; i < patterns.length; i++) {
                const m = s.match(patterns[i]);
                if (m) {
                    const lat = parseFloat(m[1]);
                    const lng = parseFloat(m[2]);
                    if (isValidCoordPair(lat, lng)) return { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
                }
            }
            return null;
        }

        function haversineKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const toRad = (deg) => (deg * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function getItemCoords(item) {
            if (!item) return null;
            if (isValidCoordPair(item.lat, item.lng)) {
                return { lat: item.lat, lng: item.lng, exact: true };
            }
            const fromUrl = extractCoordsFromUrl(item.url);
            if (fromUrl) {
                return { lat: fromUrl.lat, lng: fromUrl.lng, exact: true };
            }
            const distKey = String(item.district || "").trim().toLowerCase();
            if (distKey && DISTRICT_COORDS[distKey]) {
                return { lat: DISTRICT_COORDS[distKey][0], lng: DISTRICT_COORDS[distKey][1], exact: false };
            }
            const guessed = guessDistrict((item.title || "") + " " + (item.notes || ""), item.state);
            if (guessed && DISTRICT_COORDS[guessed.toLowerCase()]) {
                const pt = DISTRICT_COORDS[guessed.toLowerCase()];
                return { lat: pt[0], lng: pt[1], exact: false };
            }
            const st = mapState(item.state);
            if (STATE_COORDS[st]) {
                return { lat: STATE_COORDS[st][0], lng: STATE_COORDS[st][1], exact: false };
            }
            return null;
        }

        function getItemDistance(item) {
            if (!isValidCoordPair(state.nearby.lat, state.nearby.lng)) return null;
            const pt = getItemCoords(item);
            if (!pt) return null;
            return {
                km: haversineKm(state.nearby.lat, state.nearby.lng, pt.lat, pt.lng),
                exact: pt.exact
            };
        }

        function formatDistance(distObj) {
            if (!distObj || typeof distObj.km !== "number") return "";
            const prefix = distObj.exact ? "" : "~";
            if (distObj.km < 1) {
                const m = Math.max(50, Math.round((distObj.km * 1000) / 50) * 50);
                return prefix + m + " m";
            }
            if (distObj.km < 10) return prefix + distObj.km.toFixed(1) + " km";
            return prefix + Math.round(distObj.km) + " km";
        }

        function findNearestAreaLabel(lat, lng) {
            let bestName = "";
            let bestDist = Infinity;
            STATES.forEach((st) => {
                const dists = STATE_DISTRICTS[st] || [];
                dists.forEach((distName) => {
                    const pt = DISTRICT_COORDS[distName.toLowerCase()];
                    if (!pt) return;
                    const km = haversineKm(lat, lng, pt[0], pt[1]);
                    if (km < bestDist) {
                        bestDist = km;
                        bestName = distName + ", " + labelState(st);
                    }
                });
            });
            if (bestName && bestDist <= 60) return bestName;
            return lat.toFixed(3) + ", " + lng.toFixed(3);
        }

        function normalizeItem(raw, fallbackId) {
            const now = Date.now();
            const rawUrl = raw && (raw.url !== undefined ? raw.url : raw.link);
            const safeUrl = sanitizeUrl(rawUrl) || String(rawUrl || "");
            const plat = detectPlatform(safeUrl);
            const rawTitle = raw && (raw.title !== undefined ? raw.title : raw.name);
            const rawNotes = raw && (raw.notes !== undefined ? raw.notes : raw.note);
            const rawDistrict = raw && (raw.district !== undefined ? raw.district : (raw.daerah !== undefined ? raw.daerah : raw.area));

            let lat = raw && raw.lat !== undefined && raw.lat !== null && raw.lat !== "" ? Number(raw.lat) : null;
            let lng = raw && raw.lng !== undefined && raw.lng !== null && raw.lng !== "" ? Number(raw.lng) : null;
            if (!isValidCoordPair(lat, lng)) {
                const urlPt = extractCoordsFromUrl(safeUrl);
                lat = urlPt ? urlPt.lat : null;
                lng = urlPt ? urlPt.lng : null;
            }

            return {
                id: String((raw && raw.id) || fallbackId || genId()),
                title: String(rawTitle || "Tanpa Tajuk").trim(),
                url: safeUrl,
                category: mapCategory(raw && raw.category),
                state: mapState(raw && raw.state),
                district: String(rawDistrict || "").trim(),
                lat: lat,
                lng: lng,
                notes: String(rawNotes || "").trim(),
                platform: (raw && raw.platform) || plat.id,
                createdAt: Number(raw && raw.createdAt) || now,
                updatedAt: Number(raw && raw.updatedAt) || Number(raw && raw.createdAt) || now
            };
        }

        function copyText(text, toastMsg) {
            const ta = document.createElement("textarea");
            ta.value = String(text || "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy");
                if (toastMsg) showToast(toastMsg, "success");
            } catch (_) {
                showToast("Copy failed", "error");
            } finally {
                document.body.removeChild(ta);
            }
        }

        function showToast(msg, type) {
            const wrap = $("toastWrap");
            const el = document.createElement("div");
            el.className = "toast " + (type || "info");
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                el.style.transition = "opacity 0.2s ease";
                setTimeout(() => el.remove(), 220);
            }, 2600);
        }

        // =====================================================================
        // 6. LOCAL STORAGE & FIREBASE REALTIME DATABASE REST API SYNC
        // =====================================================================
        function loadLocalPrefs() {
            try {
                const savedLang = localStorage.getItem(STORAGE_KEYS.lang);
                if (savedLang === "ms" || savedLang === "en") state.lang = savedLang;

                const savedTheme = localStorage.getItem(STORAGE_KEYS.theme);
                if (savedTheme === "dark" || savedTheme === "light") state.theme = savedTheme;

                const savedCfg = JSON.parse(localStorage.getItem(STORAGE_KEYS.cfg) || "null");
                if (savedCfg && savedCfg.dbUrl) {
                    state.cfg.dbUrl = String(savedCfg.dbUrl).replace(/\/+$/, "");
                }
                if (savedCfg && savedCfg.roomId) {
                    state.cfg.roomId = String(savedCfg.roomId).trim() || DEFAULT_ROOM_ID;
                }

                const cached = JSON.parse(localStorage.getItem(STORAGE_KEYS.items) || "null");
                if (Array.isArray(cached)) {
                    state.items = cached.map((it) => normalizeItem(it));
                }
            } catch (_) {}
        }

        function saveLocalCache() {
            try {
                localStorage.setItem(STORAGE_KEYS.items, JSON.stringify(state.items));
            } catch (_) {}
        }

        function saveLocalCfg() {
            try {
                localStorage.setItem(STORAGE_KEYS.cfg, JSON.stringify(state.cfg));
            } catch (_) {}
        }

        function getRoomBaseUrl() {
            const base = String(state.cfg.dbUrl || DEFAULT_FIREBASE_DB_URL).replace(/\/+$/, "");
            const room = encodeURIComponent(String(state.cfg.roomId || DEFAULT_ROOM_ID).trim() || DEFAULT_ROOM_ID);
            return base + "/rooms/" + room + "/items";
        }

        function getLegacyBaseUrl() {
            const base = String(state.cfg.dbUrl || DEFAULT_FIREBASE_DB_URL).replace(/\/+$/, "");
            return base + "/places";
        }

        function setSyncStatus(status) {
            state.syncStatus = status;
            const d = t();
            const pill = $("syncPillBtn");
            const txt = $("syncPillText");
            pill.classList.remove("live", "warn", "syncing");
            if (status === "live") {
                pill.classList.add("live");
                txt.textContent = d.syncLive;
            } else if (status === "syncing") {
                pill.classList.add("syncing");
                txt.textContent = d.syncBusy;
            } else if (status === "warn") {
                pill.classList.add("warn");
                txt.textContent = d.syncRules;
            } else {
                txt.textContent = d.syncOffline;
            }
        }

        function parseFirebaseMap(data) {
            if (!data || typeof data !== "object") return [];
            const list = [];
            Object.keys(data).forEach((key) => {
                const val = data[key];
                if (val && typeof val === "object") {
                    list.push(normalizeItem(val, key));
                }
            });
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            return list;
        }

        async function fetchFromFirebase(silent) {
            if (state.isFetching) return;
            state.isFetching = true;
            if (!silent) setSyncStatus("syncing");

            try {
                const res = await fetch(getRoomBaseUrl() + ".json", { cache: "no-store" });
                if (res.status === 401 || res.status === 403) {
                    setSyncStatus("warn");
                    if (!silent) showToast(t().tSyncErr, "error");
                    return;
                }
                if (!res.ok) throw new Error("HTTP " + res.status);

                let data = await res.json();
                let list = parseFirebaseMap(data);

                // Fallback check legacy /places.json if room is empty
                if (list.length === 0) {
                    try {
                        const legRes = await fetch(getLegacyBaseUrl() + ".json", { cache: "no-store" });
                        if (legRes.ok) {
                            const legData = await legRes.json();
                            const legList = parseFirebaseMap(legData);
                            if (legList.length > 0) list = legList;
                        }
                    } catch (_) {}
                }

                state.items = list;
                saveLocalCache();
                setSyncStatus("live");
                renderAllViews();
            } catch (_) {
                setSyncStatus("offline");
                if (!silent) showToast(t().tSyncErr, "error");
            } finally {
                state.isFetching = false;
            }
        }

        async function savePlace(payload, editId) {
            const now = Date.now();
            const existing = editId ? state.items.find((x) => x.id === editId) : null;
            const item = normalizeItem({
                ...payload,
                id: editId || genId(),
                createdAt: existing ? existing.createdAt : now,
                updatedAt: now
            });

            // Optimistic UI update
            if (existing) {
                state.items = state.items.map((x) => (x.id === item.id ? item : x));
            } else {
                state.items = [item, ...state.items];
            }
            saveLocalCache();
            renderAllViews();

            try {
                setSyncStatus("syncing");
                const res = await fetch(getRoomBaseUrl() + "/" + encodeURIComponent(item.id) + ".json", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(item)
                });
                if (res.status === 401 || res.status === 403) {
                    setSyncStatus("warn");
                    showToast(t().tSyncErr, "error");
                    return;
                }
                if (!res.ok) throw new Error("PUT failed");
                setSyncStatus("live");
                showToast(existing ? t().tUpdated : t().tSaved, "success");
            } catch (_) {
                setSyncStatus("offline");
                showToast(existing ? t().tUpdated : t().tSaved, "info");
            }
        }

        async function deletePlace(id) {
            state.items = state.items.filter((x) => x.id !== id);
            if (state.spinWinnerId === id) {
                state.spinWinnerId = null;
                $("spinResultWrap").classList.add("hidden");
            }
            saveLocalCache();
            renderAllViews();

            try {
                setSyncStatus("syncing");
                const res = await fetch(getRoomBaseUrl() + "/" + encodeURIComponent(id) + ".json", {
                    method: "DELETE"
                });
                if (res.status === 401 || res.status === 403) {
                    setSyncStatus("warn");
                } else if (res.ok) {
                    setSyncStatus("live");
                }
                showToast(t().tDeleted, "success");
            } catch (_) {
                setSyncStatus("offline");
                showToast(t().tDeleted, "info");
            }
        }

        async function batchSaveItems(newItems) {
            if (!newItems.length) return;
            const patchObj = {};
            newItems.forEach((it) => {
                patchObj[it.id] = it;
            });

            state.items = [...newItems, ...state.items];
            saveLocalCache();
            renderAllViews();

            try {
                setSyncStatus("syncing");
                const res = await fetch(getRoomBaseUrl() + ".json", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(patchObj)
                });
                if (res.status === 401 || res.status === 403) {
                    setSyncStatus("warn");
                } else if (res.ok) {
                    setSyncStatus("live");
                }
            } catch (_) {
                setSyncStatus("offline");
            }
        }

        function startAutoSync() {
            if (state.syncTimer) clearInterval(state.syncTimer);
            state.syncTimer = setInterval(() => {
                if (document.visibilityState === "visible") {
                    fetchFromFirebase(true);
                }
            }, 7500);
        }

        // =====================================================================
        // 7. THEME, LANGUAGE & DROPDOWN POPULATORS
        // =====================================================================
