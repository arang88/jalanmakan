        function renderHomeStateSelect() {
            const d = t();
            const counts = {};
            let total = 0;
            state.items.forEach((it) => {
                if (state.homeCat !== "all" && it.category !== state.homeCat) return;
                total++;
                counts[it.state] = (counts[it.state] || 0) + 1;
            });

            // Put states that have items at the top for fast access
            const withItems = STATES.filter((st) => (counts[st] || 0) > 0);
            const withoutItems = STATES.filter((st) => !(counts[st] || 0));
            const ordered = [...withItems, ...withoutItems];

            $("homeStateSelect").innerHTML =
                '<option value="all">' + esc(d.allStates) + (total ? " (" + total + ")" : "") + '</option>' +
                ordered.map((st) => {
                    const c = counts[st] || 0;
                    return '<option value="' + esc(st) + '">' + esc(labelState(st)) + (c ? " (" + c + ")" : "") + '</option>';
                }).join("");
            $("homeStateSelect").value = state.homeState;
        }

        function renderHome() {
            const d = t();
            const isNearbyOn = state.nearby.active;
            const hasUserGps = isValidCoordPair(state.nearby.lat, state.nearby.lng);

            // Row 1: Category Chips
            $("homeCatChips").innerHTML =
                '<button type="button" class="chip' + (state.homeCat === "all" ? " active-all" : "") + '" data-home-cat="all">' + esc(d.catAll) + '</button>' +
                CATEGORIES.map((c) =>
                    '<button type="button" class="chip' + (state.homeCat === c ? (" active-" + c) : "") + '" data-home-cat="' + c + '">' +
                        CAT_ICONS[c] +
                        '<span>' + esc(labelCat(c)) + '</span>' +
                    '</button>'
                ).join("");

            // Row 2: State Dropdown + Nearby Button
            renderHomeStateSelect();
            $("btnHomeNearby").classList.toggle("is-active", isNearbyOn);
            $("btnHomeNearby").setAttribute("aria-pressed", isNearbyOn ? "true" : "false");
            $("lblHomeNearby").textContent = state.nearby.loading ? d.nearbyLocating : d.nearbyBtn;
            $("iconHomeNearby").classList.toggle("spin-anim", state.nearby.loading);

            // Nearby Active Panel
            const nearbyPanel = $("homeNearbyPanel");
            if (isNearbyOn) {
                nearbyPanel.classList.remove("hidden");
                $("iconNearbySpin").classList.toggle("spin-anim", state.nearby.loading);
                $("nearbyLocText").textContent = state.nearby.loading
                    ? d.nearbyLocating
                    : (hasUserGps ? d.nearbyHeader(state.nearby.label || (state.nearby.lat.toFixed(3) + ", " + state.nearby.lng.toFixed(3))) : d.nearbyBtn);

                $("nearbyRadiusChips").classList.toggle("hidden", !hasUserGps);
                if (hasUserGps) {
                    $("nearbyRadiusChips").innerHTML = NEARBY_RADII.map((km) => {
                        const active = state.nearby.radiusKm === km;
                        const lbl = km === 0 ? d.nearbyAllRadius : d.nearbyRadiusKm(km);
                        return '<button type="button" class="chip chip-sm' + (active ? " active-teal" : "") + '" data-nearby-radius="' + km + '">' + esc(lbl) + '</button>';
                    }).join("");
                }

                const showManual = state.nearby.manualOpen || !hasUserGps;
                $("nearbyManualRow").classList.toggle("hidden", !showManual);
                $("nearbyWarnTxt").classList.toggle("hidden", !state.nearby.error);
                $("nearbyWarnTxt").textContent = state.nearby.error || "";
            } else {
                nearbyPanel.classList.add("hidden");
            }

            // Row 3: Dynamic District Chips when a State is selected
            const distWrap = $("homeDistrictChips");
            if (state.homeState !== "all") {
                const distMap = new Map();
                state.items.forEach((it) => {
                    if (state.homeCat !== "all" && it.category !== state.homeCat) return;
                    if (it.state !== state.homeState) return;
                    const dist = String(it.district || "").trim();
                    if (!dist) return;
                    const key = dist.toLowerCase();
                    const prev = distMap.get(key);
                    if (prev) prev.count++;
                    else distMap.set(key, { key: key, label: dist, count: 1 });
                });

                const distList = Array.from(distMap.values()).sort((a, b) => a.label.localeCompare(b.label));
                if (state.homeDistrict !== "all" && !distMap.has(state.homeDistrict)) {
                    state.homeDistrict = "all";
                }

                if (distList.length > 0) {
                    distWrap.innerHTML =
                        '<button type="button" class="chip chip-sm' + (state.homeDistrict === "all" ? " active-teal" : "") + '" data-home-district="all">' + esc(d.allDistricts) + '</button>' +
                        distList.map((dl) =>
                            '<button type="button" class="chip chip-sm' + (state.homeDistrict === dl.key ? " active-teal" : "") + '" data-home-district="' + esc(dl.key) + '">' +
                                esc(dl.label) + ' (' + dl.count + ')' +
                            '</button>'
                        ).join("");
                    distWrap.classList.remove("hidden");
                } else {
                    distWrap.innerHTML = "";
                    distWrap.classList.add("hidden");
                }
            } else {
                state.homeDistrict = "all";
                distWrap.innerHTML = "";
                distWrap.classList.add("hidden");
            }

            // Filter & Sort Feed
            let rows = state.items
                .filter((it) => {
                    if (state.homeCat !== "all" && it.category !== state.homeCat) return false;
                    if (state.homeState !== "all" && it.state !== state.homeState) return false;
                    if (state.homeDistrict !== "all" && String(it.district || "").trim().toLowerCase() !== state.homeDistrict) return false;
                    return true;
                })
                .map((it) => ({
                    item: it,
                    dist: (isNearbyOn && hasUserGps) ? getItemDistance(it) : null
                }));

            if (isNearbyOn && hasUserGps) {
                if (state.nearby.radiusKm > 0) {
                    rows = rows.filter((r) => r.dist && r.dist.km <= state.nearby.radiusKm);
                }
                rows.sort((a, b) => {
                    const da = a.dist ? a.dist.km : Infinity;
                    const db = b.dist ? b.dist.km : Infinity;
                    if (da !== db) return da - db;
                    return (b.item.createdAt || 0) - (a.item.createdAt || 0);
                });
            } else {
                rows.sort((a, b) => (b.item.createdAt || 0) - (a.item.createdAt || 0));
            }

            const hasFilter = state.homeCat !== "all" || state.homeState !== "all" || state.homeDistrict !== "all" || isNearbyOn;
            $("btnHomeReset").classList.toggle("hidden", !hasFilter);

            if (rows.length === 0) {
                $("homeCardsFeed").innerHTML = "";
                $("homeCardsFeed").classList.add("hidden");
                const emptyKey = (state.items.length > 0 && isNearbyOn && hasUserGps && state.nearby.radiusKm > 0)
                    ? "widen-nearby"
                    : "reset-home";
                $("homeEmptyState").innerHTML = buildEmptyHtml(state.items.length > 0 && hasFilter, emptyKey);
                $("homeEmptyState").classList.remove("hidden");
            } else {
                $("homeEmptyState").classList.add("hidden");
                $("homeCardsFeed").classList.remove("hidden");
                $("homeCardsFeed").innerHTML = rows.map((r) => buildCardHtml(r.item, false, r.dist)).join("");
            }
        }

        function renderExplore() {
            const d = t();
            const hasUserGps = isValidCoordPair(state.nearby.lat, state.nearby.lng);

            $("expCatChips").innerHTML =
                '<button type="button" class="chip' + (state.expCat === "all" ? " active-all" : "") + '" data-exp-cat="all">' + esc(d.catAll) + '</button>' +
                CATEGORIES.map((c) =>
                    '<button type="button" class="chip' + (state.expCat === c ? (" active-" + c) : "") + '" data-exp-cat="' + c + '">' +
                        CAT_ICONS[c] +
                        '<span>' + esc(labelCat(c)) + '</span>' +
                    '</button>'
                ).join("");

            const q = state.expSearch.trim().toLowerCase();
            $("btnExpSearchClear").classList.toggle("hidden", !q);

            const rows = state.items.filter((it) => {
                if (state.expCat !== "all" && it.category !== state.expCat) return false;
                if (state.expState !== "all" && it.state !== state.expState) return false;
                if (state.expPlat !== "all" && detectPlatform(it.url).id !== state.expPlat) return false;
                if (q) {
                    const hay = (it.title + " " + it.notes + " " + (it.district || "") + " " + it.state + " " + labelState(it.state) + " " + it.category + " " + labelCat(it.category) + " " + it.url).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            }).map((it) => ({
                item: it,
                dist: hasUserGps ? getItemDistance(it) : null
            }));

            rows.sort((a, b) => {
                if (state.expSort === "nearest" && hasUserGps) {
                    const da = a.dist ? a.dist.km : Infinity;
                    const db = b.dist ? b.dist.km : Infinity;
                    if (da !== db) return da - db;
                }
                if (state.expSort === "oldest") return (a.item.createdAt || 0) - (b.item.createdAt || 0);
                if (state.expSort === "az") return a.item.title.localeCompare(b.item.title);
                return (b.item.createdAt || 0) - (a.item.createdAt || 0);
            });

            const hasFilter = Boolean(q || state.expCat !== "all" || state.expState !== "all" || state.expPlat !== "all");
            $("expResultCount").textContent = d.searchFound(rows.length);
            $("btnExpReset").classList.toggle("hidden", !hasFilter);

            if (rows.length === 0) {
                $("expCardsFeed").innerHTML = "";
                $("expCardsFeed").classList.add("hidden");
                $("expEmptyState").innerHTML = buildEmptyHtml(state.items.length > 0 && hasFilter, "reset-exp");
                $("expEmptyState").classList.remove("hidden");
            } else {
                $("expEmptyState").classList.add("hidden");
                $("expCardsFeed").classList.remove("hidden");
                $("expCardsFeed").innerHTML = rows.map((r) => buildCardHtml(r.item, false, r.dist)).join("");
            }
        }

        function getSpinPool() {
            return state.items.filter((it) => {
                if (state.spinCat !== "all" && it.category !== state.spinCat) return false;
                if (state.spinState !== "all" && it.state !== state.spinState) return false;
                return true;
            });

        function renderSpin() {
            const d = t();
            const pool = getSpinPool();
            $("btnSpinGo").disabled = pool.length === 0 || state.spinRolling;

            if (!state.spinRolling) {
                const winner = state.spinWinnerId ? state.items.find((x) => x.id === state.spinWinnerId) : null;
                if (winner) {
                    $("spinReelTitle").textContent = winner.title;
                    $("spinReelSub").textContent = d.spinWinner + " • " + formatLocation(winner);
                    $("spinResultWrap").innerHTML = buildCardHtml(winner, true, getItemDistance(winner));
                    $("spinResultWrap").classList.remove("hidden");
                    $("btnSpinGo").textContent = d.spinBtnAgain;
                } else {
                    $("spinReelTitle").textContent = pool.length > 0 ? d.spinReady : d.spinNoItems;
                    $("spinReelSub").textContent = d.spinReadySub(pool.length);
                    $("spinResultWrap").classList.add("hidden");
                    $("btnSpinGo").textContent = d.spinBtn;
                }
            }
        }

        function runRoulette() {
            const pool = getSpinPool();
            if (!pool.length || state.spinRolling) return;
            const d = t();

            state.spinRolling = true;
            $("btnSpinGo").disabled = true;
            $("btnSpinGo").textContent = d.spinRolling;
            $("spinReel").classList.add("rolling");
            $("spinResultWrap").classList.add("hidden");

            let steps = 0;
            const totalSteps = 16;
            let delay = 55;

            function tick() {
                const pick = pool[Math.floor(Math.random() * pool.length)];
                $("spinReelTitle").textContent = pick.title;
                $("spinReelSub").textContent = labelCat(pick.category) + " • " + formatLocation(pick);
                steps++;
                if (steps < totalSteps) {
                    delay += 14;
                    setTimeout(tick, delay);
                } else {
                    state.spinRolling = false;
                    state.spinWinnerId = pick.id;
                    $("spinReel").classList.remove("rolling");
                    renderSpin();
                }
            }
            tick();
        }

        function requestUserLocation(opts) {
            const o = opts || {};
            const d = t();

            if (!navigator.geolocation) {
                state.nearby.active = true;
                state.nearby.loading = false;
                state.nearby.error = d.nearbyGpsUnsupported;
                state.nearby.manualOpen = true;
                renderAllViews();
                return;
            }

            state.nearby.active = true;
            state.nearby.loading = true;
            state.nearby.error = "";
            if (!o.keepStateFilter) {
                state.homeState = "all";
                state.homeDistrict = "all";
            }
            renderAllViews();

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = Number(pos.coords.latitude.toFixed(6));
                    const lng = Number(pos.coords.longitude.toFixed(6));
                    state.nearby.lat = lat;
                    state.nearby.lng = lng;
                    state.nearby.label = findNearestAreaLabel(lat, lng);
                    state.nearby.loading = false;
                    state.nearby.error = "";
                    state.nearby.manualOpen = false;
                    renderAllViews();
                    if (!o.silent) showToast(t().tGpsFound(state.nearby.label), "success");
                },
                () => {
                    state.nearby.loading = false;
                    state.nearby.error = t().nearbyGpsDenied;
                    state.nearby.manualOpen = true;
                    renderAllViews();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 120000 }
            );
        }

        function handleUrlSmartFill(val) {

                if (txt.length >= 3) $("fieldTitle").value = txt.slice(0, 85);

            if (!$("fieldCoords").value.trim()) {
                const pt = extractCoordsFromUrl(val);
                if (pt) $("fieldCoords").value = pt.lat + ", " + pt.lng;
            }
            if (!state.userEditedCat) {
                $("fieldCategory").value = guessCategory(val);

            if (guessed.state && !state.userEditedState) {

            if (guessed.district && !state.userEditedDistrict && !$("fieldDistrict").value.trim()) {

        function parseWaChatText(rawText) {
            const lines = String(rawText || "").split(/\r?\n/);
            const existingUrls = new Set(state.items.map((x) => String(x.url || "").toLowerCase()));
            const seenInBatch = new Set();
            const results = [];

            lines.forEach((line, idx) => {
                const urls = line.match(/https?:\/\/[^\s"'<>]+/gi);
                if (!urls) return;

                // Strip WhatsApp timestamp/sender prefix
                const cleanLine = line
                    .replace(/^\[?\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM|am|pm)?\]?\s*-?\s*/, "")
                    .replace(/^[^:]{1,40}:\s+/, "");

                urls.forEach((rawUrl) => {
                    const cleanUrl = sanitizeUrl(rawUrl.replace(/[.,);!?]+$/, ""));
                    if (!cleanUrl) return;
                    const key = cleanUrl.toLowerCase();
                    if (seenInBatch.has(key)) return;
                    seenInBatch.add(key);

                    let title = cleanLine.replace(rawUrl, "").replace(/\s+/g, " ").trim();
                    if (title.length < 3 && idx > 0) {
                        const prev = lines[idx - 1]
                            .replace(/^\[?\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM|am|pm)?\]?\s*-?\s*/, "")
                            .replace(/^[^:]{1,40}:\s+/, "")
                            .trim();
                        if (prev && !/https?:\/\//i.test(prev) && prev.length >= 3 && prev.length <= 90) {
                            title = prev;
                        }
                    }
                    if (title.length < 3) {
                        const plat = detectPlatform(cleanUrl);
                        title = plat.label + " Link";
                    }

                    const contextText = title + " " + cleanUrl;
                    const loc = guessStateAndDistrict(contextText);
                    const isDup = existingUrls.has(key);
                    const coords = extractCoordsFromUrl(cleanUrl);

                    results.push({
                        selected: !isDup,
                        isDup: isDup,
                        title: title.slice(0, 90),
                        url: cleanUrl,
                        category: guessCategory(contextText),
                        state: loc.state || "Selangor",
                        district: loc.district || "",
                        lat: coords ? coords.lat : null,
                        lng: coords ? coords.lng : null,
                        notes: ""
                    });
                });
            });

            return results;
        }

        function switchTab(tab) {
            state.activeTab = tab;
            $("viewHome").classList.toggle("hidden", tab !== "home");
            $("viewExplore").classList.toggle("hidden", tab !== "explore");
            $("viewSpin").classList.toggle("hidden", tab !== "spin");
            $("viewSettings").classList.toggle("hidden", tab !== "settings");

            document.querySelectorAll(".nav-tab").forEach((btn) => {
                btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
            });

            if (tab === "home") renderHome();
            else if (tab === "explore") renderExplore();
            else if (tab === "spin") renderSpin();
            else if (tab === "settings") renderSettings();

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function handleCardActionClick(e) {
            const emptyBtn = e.target.closest("[data-empty]");
            if (emptyBtn) {
                const act = emptyBtn.getAttribute("data-empty");
                if (act === "add") openPlaceSheet(null);
                else if (act === "wa") openWaImporter();
                else if (act === "widen-nearby") {
                    state.nearby.radiusKm = 0;
                    renderHome();
                } else if (act === "reset-home") {
                    state.homeCat = "all";
                    state.homeState = "all";
                    state.homeDistrict = "all";
                    state.nearby.active = false;
                    state.nearby.loading = false;
                    renderHome();
                } else if (act === "reset-exp") {
                    state.expSearch = "";
                    state.expCat = "all";
                    state.expState = "all";
                    state.expPlat = "all";
                    $("expSearchInput").value = "";
                    $("expStateSelect").value = "all";
                    $("expPlatSelect").value = "all";
                    renderExplore();
                }
                return;
            }

            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            const act = btn.getAttribute("data-act");
            const id = btn.getAttribute("data-id");
            const item = state.items.find((x) => x.id === id);
            if (!item) return;

            if (act === "maps") openMapsSheet(item);
            else if (act === "share-wa") shareToWhatsApp(item, btn.getAttribute("data-spin") === "1");
            else if (act === "copy") copyText(item.url, t().tCopied);
            else if (act === "edit") openPlaceSheet(item);
            else if (act === "delete") openConfirmDelete(item);
        }

                const d = t();
                const titleVal = $("fieldTitle").value.trim();
                const distVal = $("fieldDistrict").value.trim();
                const stVal = mapState($("fieldState").value);
                if (!titleVal && !distVal) {
                    showToast(d.tGeoNeedInput, "info");
                    return;
                }
                const btn = $("btnAutoGeocode");
                btn.disabled = true;
                btn.textContent = d.btnGeocodeBusy;
                try {
                    const parts = [];
                    if (titleVal) parts.push(titleVal);
                    if (distVal) parts.push(distVal);
                    if (stVal !== "Luar Negara") parts.push(stVal.replace(/^WP\s+/i, ""), "Malaysia");
                    const q = encodeURIComponent(parts.join(", "));
                    const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + q, {
                        headers: { "Accept": "application/json" }
                    });
                    const arr = res.ok ? await res.json() : [];
                    if (Array.isArray(arr) && arr.length > 0 && arr[0].lat && arr[0].lon) {
                        const lat = Number(parseFloat(arr[0].lat).toFixed(6));
                        const lng = Number(parseFloat(arr[0].lon).toFixed(6));
                        if (isValidCoordPair(lat, lng)) {
                            $("fieldCoords").value = lat + ", " + lng;
                            showToast(d.tGeoOk, "success");
                        } else {
                            showToast(d.tGeoFail, "error");
                        }
                    } else if (distVal && DISTRICT_COORDS[distVal.toLowerCase()]) {
                        const pt = DISTRICT_COORDS[distVal.toLowerCase()];
                        $("fieldCoords").value = pt[0] + ", " + pt[1];
                        showToast(d.tGeoOk, "success");
                    } else {
                        showToast(d.tGeoFail, "error");
                    }
                } catch (_) {
                    if (distVal && DISTRICT_COORDS[distVal.toLowerCase()]) {
                        const pt = DISTRICT_COORDS[distVal.toLowerCase()];
                        $("fieldCoords").value = pt[0] + ", " + pt[1];
                        showToast(d.tGeoOk, "success");
                    } else {
                        showToast(d.tGeoFail, "error");
                    }
                } finally {
                    btn.disabled = false;
                    btn.textContent = t().btnAutoGeocode;
                }
            });

            $("btnUseCurrentGps").addEventListener("click", () => {
                const d = t();
                if (!navigator.geolocation) { showToast(d.nearbyGpsUnsupported, "error"); return; }
                const btn = $("btnUseCurrentGps");
                btn.disabled = true;
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = Number(pos.coords.latitude.toFixed(6));
                        const lng = Number(pos.coords.longitude.toFixed(6));
                        $("fieldCoords").value = lat + ", " + lng;
                        btn.disabled = false;
                        showToast(t().tGpsSet, "success");
                    },
                    () => {
                        btn.disabled = false;
                        showToast(t().nearbyGpsDenied, "error");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });

            $("placeForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const safeUrl = sanitizeUrl($("fieldUrl").value);
                const title = $("fieldTitle").value.trim();
                if (!safeUrl) { showToast(t().tUrlBad, "error"); $("fieldUrl").focus(); return; }
                if (!title) { showToast(t().tTitleReq, "error"); $("fieldTitle").focus(); return; }

                const rawCoords = $("fieldCoords").value.trim();
                let parsedCoords = null;
                if (rawCoords) {
                    parsedCoords = parseCoordsString(rawCoords);
                    if (!parsedCoords) { showToast(t().tCoordsBad, "error"); $("fieldCoords").focus(); return; }
                }

                const editId = $("fieldId").value || null;
                const payload = {
                    title: title,
                    url: safeUrl,
                    category: mapCategory($("fieldCategory").value),
                    state: $("fieldState").value,
                    district: $("fieldDistrict").value.trim(),
                    lat: parsedCoords ? parsedCoords.lat : null,
                    lng: parsedCoords ? parsedCoords.lng : null,
                    notes: $("fieldNotes").value.trim(),
                    platform: detectPlatform(safeUrl).id
                };
                closeSheet("placeSheet");
                await savePlace(payload, editId);
            });

            // Maps / Waze Modal Events
            $("btnOpenGoogleMaps").addEventListener("click", () => {
                const q = $("mapsQueryInput").value.trim();
                const lat = $("mapsSheet").dataset.lat;
                const lng = $("mapsSheet").dataset.lng;
                const target = (lat && lng && !q)
                    ? ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(lat + "," + lng))
                    : ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q || (lat + "," + lng)));
                window.open(target, "_blank", "noopener,noreferrer");
                closeSheet("mapsSheet");
            });

            $("btnOpenWaze").addEventListener("click", () => {
                const q = $("mapsQueryInput").value.trim();
                const lat = $("mapsSheet").dataset.lat;
                const lng = $("mapsSheet").dataset.lng;
                const target = (lat && lng)
                    ? ("https://waze.com/ul?ll=" + encodeURIComponent(lat + "," + lng) + "&navigate=yes")
                    : ("https://waze.com/ul?q=" + encodeURIComponent(q) + "&navigate=yes");
                window.open(target, "_blank", "noopener,noreferrer");
                closeSheet("mapsSheet");
            });

            // Delete Confirm Modal
            $("btnConfirmDelete").addEventListener("click", async () => {
                const id = state.pendingDeleteId;
                state.pendingDeleteId = null;
                closeSheet("confirmSheet");
                if (id) await deletePlace(id);
            });

            // Settings & Backup Events
            $("btnOpenWaImport").addEventListener("click", openWaImporter);
            $("btnExportJson").addEventListener("click", () => {
                const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "port-makan-jalan-backup.json";
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1500);
                showToast(t().tJsonExported, "success");
            });
            $("btnImportJson").addEventListener("click", () => $("jsonFileInput").click());
            $("jsonFileInput").addEventListener("change", (e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const parsed = JSON.parse(String(reader.result || "[]"));
                        if (!Array.isArray(parsed)) throw new Error("Not array");
                        const existingUrls = new Set(state.items.map((x) => String(x.url || "").toLowerCase()));
                        const fresh = [];
                        parsed.forEach((raw) => {
                            const it = normalizeItem(raw);
                            if (it.url && !existingUrls.has(it.url.toLowerCase())) {
                                existingUrls.add(it.url.toLowerCase());
                                fresh.push(it);
                            }
                        });
                        if (fresh.length) await batchSaveItems(fresh);
                        showToast(t().tJsonImported(fresh.length), "success");
                    } catch (_) {
                        showToast(t().tJsonBad, "error");
                    }
                };
                reader.readAsText(file);
            });

            $("syncForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const room = $("cfgRoom").value.trim() || DEFAULT_ROOM_ID;
                const url = $("cfgDbUrl").value.trim().replace(/\/+$/, "") || DEFAULT_FIREBASE_DB_URL;
                state.cfg.roomId = room;
                state.cfg.dbUrl = url;
                saveLocalCfg();
                await fetchFromFirebase(false);
                if (state.syncStatus === "live") showToast(t().tSyncOk, "success");
            });
            $("btnManualRefresh").addEventListener("click", async () => {
                await fetchFromFirebase(false);
                if (state.syncStatus === "live") showToast(t().tSyncOk, "success");
            });
            $("btnCopyRules").addEventListener("click", () => {
                copyText('{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}', t().tRulesCopied);
            });

            // WhatsApp Importer Modal Events
            $("btnWaPickFile").addEventListener("click", () => $("waFileInput").click());
            $("waFileInput").addEventListener("change", (e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    $("waTextInput").value = String(reader.result || "");
                    state.waParsed = parseWaChatText($("waTextInput").value);
                    renderWaPreview();
                };
                reader.readAsText(file);
            });
            $("btnWaSample").addEventListener("click", () => {
                $("waTextInput").value = [
                    "12/04/2026, 20:15 - Suami: Kopi Sawah Sekinchan sedap view padi https://www.facebook.com/share/p/sekinchan-kopi/",
                    "13/04/2026, 11:40 - Isteri: Glamping Janda Baik Pahang best untuk weekend https://www.tiktok.com/@travelmy/video/123456789",
                    "14/04/2026, 18:05 - Suami: Kayaking Tasik Putrajaya Presint 1 https://maps.google.com/?q=2.9360,101.6934"
                ].join("\n");
                state.waParsed = parseWaChatText($("waTextInput").value);
                renderWaPreview();
            });
            $("btnWaScan").addEventListener("click", () => {
                state.waParsed = parseWaChatText($("waTextInput").value);
                renderWaPreview();
            });
            $("btnWaToggleAll").addEventListener("click", () => {
                const anyChecked = state.waParsed.some((x) => x.selected);
                state.waParsed.forEach((x) => { x.selected = !anyChecked && !x.isDup; });
                renderWaPreview();
            });
            $("waList").addEventListener("change", (e) => {
                const idx = Number(e.target.getAttribute("data-wa-idx"));
                if (!isNaN(idx) && state.waParsed[idx]) {
                    state.waParsed[idx].selected = e.target.checked;
                    const count = state.waParsed.filter((x) => x.selected).length;
                    $("btnWaImportCommit").classList.toggle("hidden", count === 0);
                    $("btnWaImportCommit").textContent = t().waCommitBtn(count);
                }
            });
            $("btnWaImportCommit").addEventListener("click", async () => {
                const chosen = state.waParsed.filter((x) => x.selected);
                if (!chosen.length) return;
                const now = Date.now();
                const itemsToAdd = chosen.map((c, i) => normalizeItem({
                    id: genId() + "_" + i,
                    title: c.title,
                    url: c.url,
                    category: c.category,
                    state: c.state,
                    district: c.district,
                    lat: c.lat,
                    lng: c.lng,
                    notes: c.notes,
                    createdAt: now - i
                }));
                closeSheet("waSheet");
                await batchSaveItems(itemsToAdd);
                showToast(t().tWaImported(itemsToAdd.length), "success");
            });

            // Sheet Close Buttons & Backdrop Click
            document.querySelectorAll("[data-close]").forEach((btn) => {
                btn.addEventListener("click", () => closeSheet(btn.getAttribute("data-close")));
            });
            document.querySelectorAll(".sheet-backdrop").forEach((backdrop) => {
                backdrop.addEventListener("click", (e) => {
                    if (e.target === backdrop) closeSheet(backdrop.id);
                });
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    document.querySelectorAll(".sheet-backdrop:not(.hidden)").forEach((el) => closeSheet(el.id));
                }
            });
        }

        // =====================================================================
        // 12. BOOTSTRAP
        // =====================================================================
        function init() {
            loadLocalPrefs();
            applyTheme();
            applyLanguage();
            bindEvents();
            fetchFromFirebase(false);
            startAutoSync();
        }

        window.addEventListener("DOMContentLoaded", init);
    })();
    </script>
</body>
</html>
